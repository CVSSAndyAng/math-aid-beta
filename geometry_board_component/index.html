<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Math Buddy Geometry Board</title>
<style>
:root{
  --purple:#6757d9; --purple2:#e8e0ff; --ink:#222; --paper:#fffdf0;
  --border:#cfd5e2; --muted:#667085; --tool:#d9c5ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#222}
.shell{
  width:100%;height:720px;display:grid;grid-template-columns:146px 1fr;
  border:1px solid var(--border);border-radius:14px;overflow:hidden;background:white
}
.toolbar{
  background:#f4efff;border-right:1px solid #d9cefa;padding:10px;
  display:flex;flex-direction:column;gap:7px;overflow:auto
}
.tool{
  appearance:none;border:1px solid #beaef0;background:#e3d8ff;border-radius:10px;
  min-height:52px;padding:6px 7px;cursor:pointer;display:flex;align-items:center;
  gap:8px;font-size:13px;font-weight:600;color:#2f2850;touch-action:manipulation
}
.tool .ico{
  width:29px;height:29px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:#fff;border-radius:7px;border:1px solid #d6cef0;flex:0 0 auto
}
.tool.active{background:#cbb8ff;border-color:#6b56d6;box-shadow:inset 0 0 0 2px #6b56d6}
.tool.secondary{background:#f8f6ff}
.board-wrap{position:relative;background:var(--paper);min-width:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.top-actions{position:absolute;right:12px;top:12px;z-index:20;display:flex;gap:8px}
.action{
  border:1px solid #cbd2df;background:white;border-radius:9px;padding:9px 12px;
  font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)
}
.action.primary{background:#5f61df;color:white;border-color:#5f61df}
.length-control{display:none;align-items:center;gap:6px;background:white;border:1px solid #cbd2df;border-radius:9px;padding:5px 8px;font-size:12px;color:#444}
.length-control.visible{display:flex}
.length-control input{width:72px;border:1px solid #b8bfd0;border-radius:6px;padding:4px 6px;font:inherit}
.length-control input:focus{outline:2px solid #8d7deb;outline-offset:1px}
.status{
  position:absolute;left:12px;bottom:10px;z-index:20;background:rgba(255,255,255,.94);
  border:1px solid #e0e3eb;border-radius:8px;padding:6px 9px;font-size:12px;color:#555;
  pointer-events:none;max-width:70%
}
.measure{
  position:absolute;right:12px;bottom:10px;z-index:20;background:rgba(255,255,255,.94);
  border:1px solid #e0e3eb;border-radius:8px;padding:6px 9px;font-size:12px;color:#555;
  pointer-events:none
}
.instrument-hint{
  position:absolute;left:160px;top:12px;z-index:20;background:rgba(255,255,255,.94);
  border:1px solid #e0e3eb;border-radius:8px;padding:6px 9px;font-size:12px;color:#555;
  pointer-events:none;display:none
}
@media(max-width:800px){
  .shell{grid-template-columns:116px 1fr;height:650px}
  .tool{font-size:11px;gap:5px;padding:5px}
  .tool .ico{width:25px;height:25px;font-size:17px}
  .instrument-hint{left:128px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar" id="toolbar">
    <button class="tool active" data-tool="pen"><span class="ico">✏️</span><span>Pencil</span></button>
    <button class="tool" data-tool="line"><span class="ico">╱</span><span>Line</span></button>
    <button class="tool" data-tool="compass"><span class="ico">🧭</span><span>Compass</span></button>
    <button class="tool" data-tool="protractor"><span class="ico">◒</span><span>Protractor</span></button>
    <button class="tool" data-tool="ruler"><span class="ico">📏</span><span>Ruler</span></button>
    <button class="tool" data-tool="eraser"><span class="ico">⌫</span><span>Eraser</span></button>
    <button class="tool secondary" data-action="undo"><span class="ico">↶</span><span>Undo</span></button>
    <button class="tool secondary" data-action="clear"><span class="ico">CLR</span><span>Clear</span></button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <canvas id="canvas"></canvas>
    <div class="top-actions">
      <label class="length-control" id="lengthControl">Line length
        <input id="lineLength" type="number" min="0.1" max="50" step="0.1" inputmode="decimal" placeholder="free">
        <span>units</span>
      </label>
      <label class="length-control" id="radiusControl">Compass radius
        <input id="compassRadius" type="number" min="0.5" max="20" step="0.1" inputmode="decimal" value="7.0">
        <span>units</span>
      </label>
      <button class="action" id="gridBtn">Grid</button>
      <button class="action primary" id="saveBtn">💾 Save to notes</button>
    </div>
    <div class="instrument-hint" id="instrumentHint"></div>
    <div class="status" id="status">Pencil — Apple Pencil, touch or mouse</div>
    <div class="measure" id="measure"></div>
  </div>
</div>

<script>
const Streamlit={
  setComponentReady(){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*")},
  setFrameHeight(height){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height},"*")},
  setComponentValue(value){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value},"*")}
};

const canvas=document.getElementById("canvas");
const wrap=document.getElementById("boardWrap");
const ctx=canvas.getContext("2d");
const drawingCanvas=document.createElement("canvas");
const dctx=drawingCanvas.getContext("2d");
const statusEl=document.getElementById("status");
const measureEl=document.getElementById("measure");
const hintEl=document.getElementById("instrumentHint");
const lengthControl=document.getElementById("lengthControl");
const lineLengthInput=document.getElementById("lineLength");
const radiusControl=document.getElementById("radiusControl");
const compassRadiusInput=document.getElementById("compassRadius");

let cssW=0,cssH=0,dpr=1,tool="pen",pointerDown=false;
let sx=0,sy=0,baseImage=null,history=[],grid=false,linePreview=null;

let compass={
  visible:false,
  cx:360, cy:290,               // hinge
  radius:110,
  rotation:Math.PI*0.60,         // line from hinge toward needle/pencil midpoint
  needleAngle:Math.PI*0.82,
  pencilAngle:Math.PI*0.38,
  dragging:null,                 // "move" | "needle" | "pencil" | "sweep"
  sweepStart:null,
  sweepLast:null
};

let protractor={
  visible:false,
  cx:520, cy:410,
  radius:150,
  rotation:0,
  dragging:null,                 // "move" | "rotate" | "ray"
  rayAngle:null
};

function resizeCanvas(preserve=true){
  const old=preserve&&drawingCanvas.width?drawingCanvas.toDataURL("image/png"):null;
  const r=wrap.getBoundingClientRect();
  cssW=Math.max(320,Math.floor(r.width));cssH=Math.max(420,Math.floor(r.height));
  dpr=Math.max(1,window.devicePixelRatio||1);
  canvas.width=Math.floor(cssW*dpr);canvas.height=Math.floor(cssH*dpr);
  drawingCanvas.width=Math.floor(cssW*dpr);drawingCanvas.height=Math.floor(cssH*dpr);
  canvas.style.width=cssW+"px";canvas.style.height=cssH+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  dctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap=dctx.lineCap="round";ctx.lineJoin=dctx.lineJoin="round";
  if(old){const im=new Image();im.onload=()=>{dctx.drawImage(im,0,0,cssW,cssH);redrawOverlay()};im.src=old}
  else redrawOverlay();
}
new ResizeObserver(()=>resizeCanvas(true)).observe(wrap);

function pos(e){const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)}
function remember(){history.push(drawingCanvas.toDataURL("image/png"));if(history.length>30)history.shift()}
function restore(data,after=null){
  const im=new Image();
  im.onload=()=>{dctx.clearRect(0,0,cssW,cssH);dctx.drawImage(im,0,0,cssW,cssH);if(after)after();else redrawOverlay()};
  im.src=data
}
function angleNorm(a){while(a<0)a+=Math.PI*2;while(a>=Math.PI*2)a-=Math.PI*2;return a}
function shortestDelta(a,b){let d=angleNorm(a)-angleNorm(b);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d}
function pointFrom(cx,cy,r,a){return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function compassRadiusPx(){
  const c=compass;
  const needle=pointFrom(c.cx,c.cy,c.radius,c.needleAngle);
  const pencil=pointFrom(c.cx,c.cy,c.radius,c.pencilAngle);
  return dist(needle[0],needle[1],pencil[0],pencil[1])
}
function setCompassRadius(units){
  if(!Number.isFinite(units)||units<=0)return;
  const c=compass,target=Math.max(10,Math.min(400,units*20));
  c.radius=Math.max(70,Math.min(240,Math.max(c.radius,target/1.9)));
  const separation=2*Math.asin(Math.min(.999,target/(2*c.radius)));
  const side=shortestDelta(c.pencilAngle,c.needleAngle)>=0?1:-1;
  c.pencilAngle=c.needleAngle+side*separation;
  compassRadiusInput.value=(compassRadiusPx()/20).toFixed(1);
  measureEl.textContent="Compass radius: "+compassRadiusInput.value+" units";
  redrawOverlay()
}

function drawGridOverlay(){
  ctx.save();ctx.strokeStyle="rgba(100,110,130,.13)";ctx.lineWidth=1;
  for(let x=20;x<cssW;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cssH);ctx.stroke()}
  for(let y=20;y<cssH;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cssW,y);ctx.stroke()}
  ctx.restore()
}

function drawCompass(){
  if(!compass.visible)return;
  const c=compass;
  const needle=pointFrom(c.cx,c.cy,c.radius,c.needleAngle);
  const pencil=pointFrom(c.cx,c.cy,c.radius,c.pencilAngle);

  ctx.save();

  // legs
  ctx.lineWidth=15;ctx.strokeStyle="#766fe0";
  ctx.beginPath();ctx.moveTo(c.cx,c.cy);ctx.lineTo(needle[0],needle[1]);ctx.stroke();
  ctx.beginPath();ctx.moveTo(c.cx,c.cy);ctx.lineTo(pencil[0],pencil[1]);ctx.stroke();

  // inner highlights
  ctx.lineWidth=4;ctx.strokeStyle="#b5b0ff";
  ctx.beginPath();ctx.moveTo(c.cx,c.cy);ctx.lineTo(needle[0],needle[1]);ctx.stroke();
  ctx.beginPath();ctx.moveTo(c.cx,c.cy);ctx.lineTo(pencil[0],pencil[1]);ctx.stroke();

  // needle foot
  ctx.strokeStyle="#333";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(needle[0],needle[1]);ctx.lineTo(needle[0]-4,needle[1]+15);ctx.stroke();

  // pencil leg
  ctx.strokeStyle="#c98900";ctx.fillStyle="#ffc347";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(pencil[0]-5,pencil[1]-18);ctx.lineTo(pencil[0]+5,pencil[1]-18);
  ctx.lineTo(pencil[0]+5,pencil[1]+12);ctx.lineTo(pencil[0],pencil[1]+23);
  ctx.lineTo(pencil[0]-5,pencil[1]+12);ctx.closePath();ctx.fill();ctx.stroke();

  // hinge
  ctx.fillStyle="#151515";ctx.beginPath();ctx.arc(c.cx,c.cy,15,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ddd";ctx.beginPath();ctx.arc(c.cx,c.cy,4,0,Math.PI*2);ctx.fill();

  // handles
  ctx.fillStyle="#fff";ctx.strokeStyle="#5f61df";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(needle[0],needle[1],8,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(pencil[0],pencil[1],8,0,Math.PI*2);ctx.fill();ctx.stroke();

  // radius hint
  ctx.font="12px Arial";ctx.fillStyle="#333";
  ctx.fillText("r = "+(compassRadiusPx()/20).toFixed(1)+" units",c.cx+18,c.cy-20);

  ctx.restore();
}

function drawProtractor(){
  if(!protractor.visible)return;
  const p=protractor;
  ctx.save();
  ctx.translate(p.cx,p.cy);
  ctx.rotate(p.rotation);

  // translucent body
  ctx.fillStyle="rgba(240,236,210,.78)";
  ctx.strokeStyle="#5c5c5c";ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(0,0,p.radius,Math.PI,0,false);
  ctx.lineTo(p.radius,0);ctx.lineTo(-p.radius,0);ctx.closePath();
  ctx.fill();ctx.stroke();

  // inner semicircle
  ctx.beginPath();ctx.arc(0,0,p.radius*.72,Math.PI,0,false);ctx.stroke();

  // degree marks 0..180
  for(let deg=0;deg<=180;deg++){
    const a=Math.PI-deg*Math.PI/180;
    const major=deg%10===0;
    const medium=deg%5===0;
    const len=major?18:(medium?12:7);
    const r1=p.radius-len,r2=p.radius;
    ctx.lineWidth=major?1.6:0.7;
    ctx.beginPath();ctx.moveTo(r1*Math.cos(a),r1*Math.sin(a));
    ctx.lineTo(r2*Math.cos(a),r2*Math.sin(a));ctx.stroke();
    if(major && deg%20===0){
      ctx.save();ctx.translate((p.radius-32)*Math.cos(a),(p.radius-32)*Math.sin(a));
      ctx.rotate(-p.rotation);ctx.font="10px Arial";ctx.fillStyle="#333";
      ctx.fillText(String(deg),-7,3);ctx.restore()
    }
  }

  // centre mark + baseline
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-p.radius,0);ctx.lineTo(p.radius,0);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fillStyle="#5f61df";ctx.fill();

  // rotation handle
  ctx.fillStyle="#fff";ctx.strokeStyle="#5f61df";
  ctx.beginPath();ctx.arc(0,-p.radius-24,9,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-p.radius);ctx.lineTo(0,-p.radius-16);ctx.stroke();

  // optional ray
  if(p.rayAngle!==null){
    const local=p.rayAngle-p.rotation;
    ctx.strokeStyle="#1f5fbf";ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(p.radius*.95*Math.cos(local),p.radius*.95*Math.sin(local));ctx.stroke()
  }
  ctx.restore();

  if(p.rayAngle!==null){
    let rel=angleNorm(p.rayAngle-p.rotation);
    let deg=rel*180/Math.PI;
    if(deg>180)deg=360-deg;
    measureEl.textContent="Measured angle: "+deg.toFixed(1)+"°"
  }
}

function redrawOverlay(){
  ctx.clearRect(0,0,cssW,cssH);
  ctx.drawImage(drawingCanvas,0,0,cssW,cssH);
  if(grid)drawGridOverlay();
  if(linePreview){
    ctx.save();ctx.strokeStyle="#222";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(linePreview.x1,linePreview.y1);ctx.lineTo(linePreview.x2,linePreview.y2);ctx.stroke();ctx.restore()
  }
  drawCompass();
  drawProtractor();
}

function setTool(t){
  if(tool===t && (t==="compass"||t==="protractor"))t="pen";
  tool=t;
  linePreview=null;
  document.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("active",b.dataset.tool===t));
  compass.visible=t==="compass";
  protractor.visible=t==="protractor";
  measureEl.textContent="";
  hintEl.style.display=(t==="compass"||t==="protractor")?"block":"none";
  lengthControl.classList.toggle("visible",t==="line"||t==="ruler");
  radiusControl.classList.toggle("visible",t==="compass");
  if(t==="compass"){
    statusEl.textContent="Compass — type a radius or adjust the white handle; drag hinge to move; drag pencil tip to draw an arc";
    hintEl.textContent="Compass: set radius above • hinge = move • pencil tip = sweep arc"
  }else if(t==="protractor"){
    statusEl.textContent="Protractor — drag its body to move; drag top handle to rotate; drag from centre to place/read a ray";
    hintEl.textContent="Protractor: body = move • top handle = rotate • centre = measure/draw ray"
  }else{
    hintEl.style.display="none";
    statusEl.textContent={
      pen:"Pencil — Apple Pencil, touch or mouse",
      line:"Line — optionally type an exact length, then drag to choose direction",
      ruler:"Ruler — drag between two points",
      eraser:"Eraser — drag over unwanted working"
    }[t]||t
  }
  baseImage=drawingCanvas.toDataURL("image/png");
  redrawOverlay()
}

document.querySelectorAll("[data-tool]").forEach(btn=>btn.addEventListener("click",()=>setTool(btn.dataset.tool)));

function hitCompass(x,y){
  const c=compass;
  const needle=pointFrom(c.cx,c.cy,c.radius,c.needleAngle);
  const pencil=pointFrom(c.cx,c.cy,c.radius,c.pencilAngle);
  if(dist(x,y,c.cx,c.cy)<22)return"move";
  if(dist(x,y,needle[0],needle[1])<18)return"needle";
  if(dist(x,y,pencil[0],pencil[1])<22)return"pencil";
  return null
}

function hitProtractor(x,y){
  const p=protractor;
  const handle=pointFrom(p.cx,p.cy,p.radius+24,p.rotation-Math.PI/2);
  if(dist(x,y,handle[0],handle[1])<20)return"rotate";
  if(dist(x,y,p.cx,p.cy)<20)return"ray";
  if(dist(x,y,p.cx,p.cy)<p.radius+10)return"move";
  return null
}

function commitArc(prevAngle,newAngle){
  const c=compass;
  const needle=pointFrom(c.cx,c.cy,c.radius,c.needleAngle);
  // arc centre is needle point; radius equals distance needle->pencil
  const pencil=pointFrom(c.cx,c.cy,c.radius,c.pencilAngle);
  const rr=dist(needle[0],needle[1],pencil[0],pencil[1]);
  const delta=shortestDelta(newAngle,prevAngle);
  dctx.save();dctx.strokeStyle="#222";dctx.lineWidth=2;
  dctx.beginPath();dctx.arc(needle[0],needle[1],rr,prevAngle,prevAngle+delta,delta<0);dctx.stroke();dctx.restore()
}

function pointerStart(e){
  e.preventDefault();
  const [x,y]=pos(e);

  if(tool==="compass"){
    const h=hitCompass(x,y);
    if(h){
      remember();
      compass.dragging=h;
      if(h==="pencil"){
        const needle=pointFrom(compass.cx,compass.cy,compass.radius,compass.needleAngle);
        const pencil=pointFrom(compass.cx,compass.cy,compass.radius,compass.pencilAngle);
        compass.sweepStart=Math.atan2(pencil[1]-needle[1],pencil[0]-needle[0]);
        compass.sweepLast=compass.sweepStart
      }
      pointerDown=true;return
    }
  }

  if(tool==="protractor"){
    const h=hitProtractor(x,y);
    if(h){
      remember();protractor.dragging=h;pointerDown=true;
      if(h==="ray")protractor.rayAngle=Math.atan2(y-protractor.cy,x-protractor.cx);
      return
    }
  }

  remember();pointerDown=true;[sx,sy]=[x,y];baseImage=drawingCanvas.toDataURL("image/png");
  if(tool==="pen"||tool==="eraser"){dctx.beginPath();dctx.moveTo(sx,sy)}
}

function pointerMove(e){
  if(!pointerDown)return;
  e.preventDefault();
  const [x,y]=pos(e);

  if(tool==="compass" && compass.dragging){
    const c=compass;
    if(c.dragging==="move"){
      c.cx=x;c.cy=y
    }else if(c.dragging==="needle"){
      c.radius=Math.max(45,Math.min(220,dist(c.cx,c.cy,x,y)));
      c.needleAngle=Math.atan2(y-c.cy,x-c.cx)
    }else if(c.dragging==="pencil"){
      const needle=pointFrom(c.cx,c.cy,c.radius,c.needleAngle);
      const ang=Math.atan2(y-needle[1],x-needle[0]);
      const delta=shortestDelta(ang,c.sweepLast);
      commitArc(c.sweepLast,ang);
      const oldPencil=pointFrom(c.cx,c.cy,c.radius,c.pencilAngle);
      const hx=c.cx-needle[0],hy=c.cy-needle[1];
      const px=oldPencil[0]-needle[0],py=oldPencil[1]-needle[1];
      const cos=Math.cos(delta),sin=Math.sin(delta);
      c.cx=needle[0]+hx*cos-hy*sin;c.cy=needle[1]+hx*sin+hy*cos;
      const newPencil=[needle[0]+px*cos-py*sin,needle[1]+px*sin+py*cos];
      c.needleAngle=Math.atan2(needle[1]-c.cy,needle[0]-c.cx);
      c.pencilAngle=Math.atan2(newPencil[1]-c.cy,newPencil[0]-c.cx);
      c.sweepLast=ang
    }
    compassRadiusInput.value=(compassRadiusPx()/20).toFixed(1);
    measureEl.textContent="Compass radius: "+compassRadiusInput.value+" units";
    redrawOverlay();return
  }

  if(tool==="protractor" && protractor.dragging){
    const p=protractor;
    if(p.dragging==="move"){p.cx=x;p.cy=y}
    else if(p.dragging==="rotate"){p.rotation=Math.atan2(y-p.cy,x-p.cx)+Math.PI/2}
    else if(p.dragging==="ray"){p.rayAngle=Math.atan2(y-p.cy,x-p.cx)}
    redrawOverlay();return
  }

  if(tool==="pen"||tool==="eraser"){
    dctx.save();dctx.strokeStyle=tool==="eraser"?"#fffdf0":"#222";
    const pressure=(e.pressure&&e.pressure>0)?e.pressure:.5;
    dctx.lineWidth=tool==="eraser"?20:Math.max(1.5,1.3+pressure*2.3);
    dctx.lineTo(x,y);dctx.stroke();dctx.restore();redrawOverlay();return
  }

  if(tool==="line"||tool==="ruler"){
    let dx=x-sx,dy=y-sy;
    let px=Math.hypot(dx,dy);
    const exact=Number.parseFloat(lineLengthInput.value);
    if(Number.isFinite(exact)&&exact>0){
      const target=exact*20;
      if(px<1){dx=target;dy=0}else{dx=dx/px*target;dy=dy/px*target}
      px=target
    }
    linePreview={x1:sx,y1:sy,x2:sx+dx,y2:sy+dy};
    measureEl.textContent="Line length: "+(px/20).toFixed(1)+" units";
    redrawOverlay();return
  }
}

function pointerEnd(e){
  if(!pointerDown)return;
  pointerDown=false;
  if((tool==="line"||tool==="ruler")&&linePreview){
    dctx.save();dctx.strokeStyle="#222";dctx.lineWidth=2;
    dctx.beginPath();dctx.moveTo(linePreview.x1,linePreview.y1);dctx.lineTo(linePreview.x2,linePreview.y2);dctx.stroke();
    if(tool==="ruler"){
      const px=Math.hypot(linePreview.x2-linePreview.x1,linePreview.y2-linePreview.y1);
      dctx.font="13px Arial";dctx.fillStyle="#222";
      dctx.fillText((px/20).toFixed(1)+" units",(linePreview.x1+linePreview.x2)/2+8,(linePreview.y1+linePreview.y2)/2-8)
    }
    dctx.restore();linePreview=null;redrawOverlay()
  }
  if(tool==="compass")compass.dragging=null;
  if(tool==="protractor")protractor.dragging=null
}

canvas.addEventListener("pointerdown",pointerStart,{passive:false});
canvas.addEventListener("pointermove",pointerMove,{passive:false});
canvas.addEventListener("pointerup",pointerEnd,{passive:false});
canvas.addEventListener("pointercancel",pointerEnd,{passive:false});

document.querySelector('[data-action="undo"]').addEventListener("click",()=>{if(history.length)restore(history.pop(),redrawOverlay)});
document.querySelector('[data-action="clear"]').addEventListener("click",()=>{
  remember();dctx.clearRect(0,0,cssW,cssH);linePreview=null;redrawOverlay();measureEl.textContent=""
});
compassRadiusInput.addEventListener("change",()=>setCompassRadius(Number.parseFloat(compassRadiusInput.value)));
compassRadiusInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();setCompassRadius(Number.parseFloat(compassRadiusInput.value));canvas.focus()}});

document.getElementById("gridBtn").addEventListener("click",()=>{
  grid=!grid;document.getElementById("gridBtn").textContent=grid?"Grid ✓":"Grid";redrawOverlay()
});
document.getElementById("saveBtn").addEventListener("click",()=>{
  // Save only the student's drawing plus currently visible construction instruments.
  const value={kind:"geometry_board_png",data_url:canvas.toDataURL("image/png"),saved_at:Date.now()};
  Streamlit.setComponentValue(value);statusEl.textContent="Saved to lesson notes"
});

window.addEventListener("message",(event)=>{
  const data=event.data;
  if(data&&data.type==="streamlit:render")Streamlit.setFrameHeight(730)
});

resizeCanvas(false);
Streamlit.setComponentReady();
Streamlit.setFrameHeight(730);
</script>
</body>
</html>
