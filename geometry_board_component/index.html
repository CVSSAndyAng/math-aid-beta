<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Math Buddy Geometry Board</title>
<style>
:root{
  --purple:#6757d9; --purple2:#e8e0ff; --ink:#222; --paper:#fffdf0;
  --border:#cfd5e2; --muted:#667085; --tool:#d9c5ff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent;font-family:Arial,Helvetica,sans-serif;color:#222}
.shell{
  width:100%;height:720px;display:grid;grid-template-columns:146px 1fr;
  border:1px solid var(--border);border-radius:14px;overflow:hidden;background:white
}
.toolbar{
  background:#f4efff;border-right:1px solid #d9cefa;padding:10px;
  display:flex;flex-direction:column;gap:7px;overflow:auto
}
.tool{
  appearance:none;border:1px solid #beaef0;background:#e3d8ff;border-radius:10px;
  min-height:52px;padding:6px 7px;cursor:pointer;display:flex;align-items:center;
  gap:8px;font-size:13px;font-weight:600;color:#2f2850;touch-action:manipulation
}
.tool .ico{
  width:29px;height:29px;display:flex;align-items:center;justify-content:center;
  font-size:19px;background:#fff;border-radius:7px;border:1px solid #d6cef0;flex:0 0 auto
}
.tool.active{background:#cbb8ff;border-color:#6b56d6;box-shadow:inset 0 0 0 2px #6b56d6}
.tool.secondary{background:#f8f6ff}
.board-wrap{position:relative;background:var(--paper);min-width:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.top-actions{position:absolute;right:12px;top:12px;z-index:20;display:flex;gap:8px}
.action{
  border:1px solid #cbd2df;background:white;border-radius:9px;padding:9px 12px;
  font-size:13px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)
}
.action.primary{background:#5f61df;color:white;border-color:#5f61df}
.length-control{display:none;align-items:center;gap:6px;background:white;border:1px solid #cbd2df;border-radius:9px;padding:5px 8px;font-size:12px;color:#444}
.length-control.visible{display:flex}
.length-control input{width:72px;border:1px solid #b8bfd0;border-radius:6px;padding:4px 6px;font:inherit}
.length-control input:focus{outline:2px solid #8d7deb;outline-offset:1px}
.status{
  position:absolute;left:12px;bottom:10px;z-index:20;background:rgba(255,255,255,.94);
  border:1px solid #e0e3eb;border-radius:8px;padding:6px 9px;font-size:12px;color:#555;
  pointer-events:none;max-width:70%
}
.measure{
  position:absolute;right:12px;bottom:10px;z-index:20;background:rgba(255,255,255,.94);
  border:1px solid #e0e3eb;border-radius:8px;padding:6px 9px;font-size:12px;color:#555;
  pointer-events:none
}
.instrument-hint{
  position:absolute;left:160px;top:12px;z-index:20;background:rgba(255,255,255,.94);
  border:1px solid #e0e3eb;border-radius:8px;padding:6px 9px;font-size:12px;color:#555;
  pointer-events:none;display:none
}
@media(max-width:800px){
  .shell{grid-template-columns:116px 1fr;height:650px}
  .tool{font-size:11px;gap:5px;padding:5px}
  .tool .ico{width:25px;height:25px;font-size:17px}
  .instrument-hint{left:128px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="toolbar" id="toolbar">
    <button class="tool active" data-tool="pen"><span class="ico">✏️</span><span>Pencil</span></button>
    <button class="tool" data-tool="line"><span class="ico">╱</span><span>Line</span></button>
    <button class="tool" data-tool="compass"><span class="ico">🧭</span><span>Compass</span></button>
    <button class="tool" data-tool="protractor"><span class="ico">◒</span><span>Protractor</span></button>
    <button class="tool" data-tool="ruler"><span class="ico">📏</span><span>Ruler</span></button>
    <button class="tool" data-tool="move"><span class="ico">✥</span><span>Move</span></button>
    <button class="tool" data-tool="eraser"><span class="ico">⌫</span><span>Eraser</span></button>
    <button class="tool secondary" data-action="undo"><span class="ico">↶</span><span>Undo</span></button>
    <button class="tool secondary" data-action="clear"><span class="ico">CLR</span><span>Clear</span></button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <canvas id="canvas"></canvas>
    <div class="top-actions">
      <label class="length-control" id="lengthControl">Line length
        <input id="lineLength" type="number" min="0.1" max="50" step="0.1" inputmode="decimal" placeholder="free">
        <span>units</span>
      </label>
      <label class="length-control" id="radiusControl">Radius: needle → pencil tip
        <input id="compassRadius" type="number" min="0.5" max="20" step="0.1" inputmode="decimal" value="7.0">
        <span>units</span>
      </label>
      <button class="action" id="gridBtn">Grid</button>
      <button class="action primary" id="saveBtn">💾 Save to notes</button>
    </div>
    <div class="instrument-hint" id="instrumentHint"></div>
    <div class="status" id="status">Pencil — Apple Pencil, touch or mouse</div>
    <div class="measure" id="measure"></div>
  </div>
</div>

<script>
const Streamlit={
  setComponentReady(){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:componentReady",apiVersion:1},"*")},
  setFrameHeight(height){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setFrameHeight",height},"*")},
  setComponentValue(value){window.parent.postMessage({isStreamlitMessage:true,type:"streamlit:setComponentValue",value},"*")}
};

const canvas=document.getElementById("canvas");
const wrap=document.getElementById("boardWrap");
const ctx=canvas.getContext("2d");
const drawingCanvas=document.createElement("canvas");
const dctx=drawingCanvas.getContext("2d");
const statusEl=document.getElementById("status");
const measureEl=document.getElementById("measure");
const hintEl=document.getElementById("instrumentHint");
const lengthControl=document.getElementById("lengthControl");
const lineLengthInput=document.getElementById("lineLength");
const radiusControl=document.getElementById("radiusControl");
const compassRadiusInput=document.getElementById("compassRadius");

let cssW=0,cssH=0,dpr=1,tool="pen",pointerDown=false;
let sx=0,sy=0,baseImage=null,history=[],grid=false,linePreview=null;
let segments=[],selectedSegment=-1,moveStart=null,moveOriginal=null,moveAction=null;

let compass={
  visible:false,
  cx:360, cy:290,               // hinge
  radius:110,
  rotation:Math.PI*0.60,         // line from hinge toward needle/pencil midpoint
  needleAngle:Math.PI*0.82,
  pencilAngle:Math.PI*0.38,
  dragging:null,                 // "move" | "needle" | "pencil" | "sweep"
  sweepStart:null,
  sweepLast:null
};

let protractor={
  visible:false,
  cx:520, cy:410,
  radius:150,
  rotation:0,
  dragging:null,                 // "move" | "rotate" | "ray"
  rayAngle:null
};

let rulerInstrument={
  visible:false,
  cx:430,cy:330,
  length:320,width:58,
  rotation:0,
  dragging:null
};

function resizeCanvas(preserve=true){
  const old=preserve&&drawingCanvas.width?drawingCanvas.toDataURL("image/png"):null;
  const r=wrap.getBoundingClientRect();
  cssW=Math.max(320,Math.floor(r.width));cssH=Math.max(420,Math.floor(r.height));
  dpr=Math.max(1,window.devicePixelRatio||1);
  canvas.width=Math.floor(cssW*dpr);canvas.height=Math.floor(cssH*dpr);
  drawingCanvas.width=Math.floor(cssW*dpr);drawingCanvas.height=Math.floor(cssH*dpr);
  canvas.style.width=cssW+"px";canvas.style.height=cssH+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  dctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineCap=dctx.lineCap="round";ctx.lineJoin=dctx.lineJoin="round";
  rulerInstrument.length=Math.min(320,Math.max(220,cssW-60));
  rulerInstrument.cx=Math.max(40,Math.min(cssW-40,rulerInstrument.cx));
  rulerInstrument.cy=Math.max(60,Math.min(cssH-40,rulerInstrument.cy));
  if(old){const im=new Image();im.onload=()=>{dctx.drawImage(im,0,0,cssW,cssH);redrawOverlay()};im.src=old}
  else redrawOverlay();
}
new ResizeObserver(()=>resizeCanvas(true)).observe(wrap);

function pos(e){const r=canvas.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]}
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1)}
function remember(){
  history.push({image:drawingCanvas.toDataURL("image/png"),segments:segments.map(s=>({...s}))});
  if(history.length>30)history.shift()
}
function restore(snapshot,after=null){
  const data=typeof snapshot==="string"?snapshot:snapshot.image;
  const im=new Image();
  im.onload=()=>{
    dctx.clearRect(0,0,cssW,cssH);dctx.drawImage(im,0,0,cssW,cssH);
    segments=Array.isArray(snapshot?.segments)?snapshot.segments.map(s=>({...s})):segments;
    selectedSegment=-1;
    if(after)after();else redrawOverlay()
  };
  im.src=data
}
function angleNorm(a){while(a<0)a+=Math.PI*2;while(a>=Math.PI*2)a-=Math.PI*2;return a}
function shortestDelta(a,b){let d=angleNorm(a)-angleNorm(b);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d}
function pointFrom(cx,cy,r,a){return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function compassRadiusPx(){
  const c=compass;
  const needle=pointFrom(c.cx,c.cy,c.radius,c.needleAngle);
  const pencil=pointFrom(c.cx,c.cy,c.radius,c.pencilAngle);
  return dist(needle[0],needle[1],pencil[0],pencil[1])
}
function setCompassRadius(units){
  if(!Number.isFinite(units)||units<=0)return;
  const c=compass,target=Math.max(10,Math.min(400,units*20));
  c.radius=Math.max(70,Math.min(240,Math.max(c.radius,target/1.9)));
  const separation=2*Math.asin(Math.min(.999,target/(2*c.radius)));
  const side=shortestDelta(c.pencilAngle,c.needleAngle)>=0?1:-1;
  c.pencilAngle=c.needleAngle+side*separation;
  compassRadiusInput.value=(compassRadiusPx()/20).toFixed(1);
  measureEl.textContent="Radius (needle → pencil tip): "+compassRadiusInput.value+" units";
  redrawOverlay()
}

function drawGridOverlay(){
  ctx.save();ctx.strokeStyle="rgba(100,110,130,.13)";ctx.lineWidth=1;
  for(let x=20;x<cssW;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cssH);ctx.stroke()}
  for(let y=20;y<cssH;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cssW,y);ctx.stroke()}
  ctx.restore()
}

function pointSegmentDistance(px,py,s){
  const vx=s.x2-s.x1,vy=s.y2-s.y1,wx=px-s.x1,wy=py-s.y1;
  const vv=vx*vx+vy*vy;
  const t=vv>0?Math.max(0,Math.min(1,(wx*vx+wy*vy)/vv)):0;
  return Math.hypot(px-(s.x1+t*vx),py-(s.y1+t*vy))
}

function hitSegment(x,y,tolerance=14){
  let best=-1,bestDistance=tolerance;
  segments.forEach((s,index)=>{const d=pointSegmentDistance(x,y,s);if(d<=bestDistance){best=index;bestDistance=d}});
  return best
}

function rotationHandle(s){
  const mx=(s.x1+s.x2)/2,my=(s.y1+s.y2)/2;
  const dx=s.x2-s.x1,dy=s.y2-s.y1,len=Math.max(1,Math.hypot(dx,dy));
  return {x:mx-dy/len*34,y:my+dx/len*34,mx,my}
}

function hitRotationHandle(x,y,s){
  const h=rotationHandle(s);
  return Math.hypot(x-h.x,y-h.y)<=16
}

function drawSegments(){
  segments.forEach((s,index)=>{
    ctx.save();
    ctx.strokeStyle=index===selectedSegment&&tool==="move"?"#5f61df":"#222";
    ctx.lineWidth=index===selectedSegment&&tool==="move"?4:2;
    ctx.beginPath();ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);ctx.stroke();
    if(s.label){
      ctx.font="13px Arial";ctx.fillStyle="#222";
      ctx.fillText(s.label,(s.x1+s.x2)/2+8,(s.y1+s.y2)/2-8)
    }
    if(index===selectedSegment&&tool==="move"){
      const h=rotationHandle(s);
      ctx.setLineDash([4,4]);ctx.strokeStyle="#7b6de3";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(h.mx,h.my);ctx.lineTo(h.x,h.y);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle="#fff";ctx.strokeStyle="#5f61df";ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(h.x,h.y,10,0,Math.PI*2);ctx.fill();ctx.stroke();
      ctx.fillStyle="#5f61df";ctx.font="bold 13px Arial";ctx.fillText("↻",h.x-6,h.y+5)
    }
    ctx.restore()
  })
}

function eraseSegmentsAt(x,y){
  const before=segments.length;
  segments=segments.filter(s=>pointSegmentDistance(x,y,s)>12);
  if(selectedSegment>=segments.length)selectedSegment=-1;
  return segments.length!==before
}

function drawCompassRadiusDimension(needle,pencil){
  const c=compass,dx=pencil[0]-needle[0],dy=pencil[1]-needle[1],length=Math.max(1,Math.hypot(dx,dy));
  let nx=-dy/length,ny=dx/length;
  const mx=(needle[0]+pencil[0])/2,my=(needle[1]+pencil[1])/2,offset=34;
  const plusDistance=Math.hypot(mx+nx*offset-c.cx,my+ny*offset-c.cy);
  const minusDistance=Math.hypot(mx-nx*offset-c.cx,my-ny*offset-c.cy);
  if(minusDistance>plusDistance){nx=-nx;ny=-ny}
  const a=[needle[0]+nx*offset,needle[1]+ny*offset];
  const b=[pencil[0]+nx*offset,pencil[1]+ny*offset];

  ctx.save();
  ctx.strokeStyle="rgba(76,67,166,.72)";ctx.lineWidth=1.4;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(needle[0],needle[1]);ctx.lineTo(a[0],a[1]);
  ctx.moveTo(pencil[0],pencil[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle="#5044b5";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  const angle=Math.atan2(dy,dx),arrow=8,spread=.55;
  for(const [point,direction] of [[a,angle],[b,angle+Math.PI]]){
    ctx.beginPath();ctx.moveTo(point[0],point[1]);
    ctx.lineTo(point[0]+arrow*Math.cos(direction+spread),point[1]+arrow*Math.sin(direction+spread));
    ctx.moveTo(point[0],point[1]);
    ctx.lineTo(point[0]+arrow*Math.cos(direction-spread),point[1]+arrow*Math.sin(direction-spread));ctx.stroke()
  }

  const label="Radius (needle → pencil tip): "+(length/20).toFixed(1)+" units";
  const lx=(a[0]+b[0])/2+nx*15,ly=(a[1]+b[1])/2+ny*15;
  ctx.font="bold 11px Arial";ctx.textAlign="center";ctx.textBaseline="middle";
  const labelWidth=ctx.measureText(label).width+10;
  ctx.fillStyle="rgba(255,255,255,.94)";ctx.fillRect(lx-labelWidth/2,ly-9,labelWidth,18);
  ctx.fillStyle="#3f358f";ctx.fillText(label,lx,ly);

  ctx.font="bold 10px Arial";ctx.textBaseline="alphabetic";
  ctx.fillStyle="#333";ctx.fillText("Needle / centre",a[0],a[1]+ny*14);
  ctx.fillText("Pencil tip",b[0],b[1]+ny*14);
  ctx.restore()
}

function drawCompass(){
  if(!compass.visible)return;
  const c=compass;
  const needle=pointFrom(c.cx,c.cy,c.radius,c.needleAngle);
  const pencil=pointFrom(c.cx,c.cy,c.radius,c.pencilAngle);

  ctx.save();

  // legs
  ctx.lineWidth=15;ctx.strokeStyle="#766fe0";
  ctx.beginPath();ctx.moveTo(c.cx,c.cy);ctx.lineTo(needle[0],needle[1]);ctx.stroke();
  ctx.beginPath();ctx.moveTo(c.cx,c.cy);ctx.lineTo(pencil[0],pencil[1]);ctx.stroke();

  // inner highlights
  ctx.lineWidth=4;ctx.strokeStyle="#b5b0ff";
  ctx.beginPath();ctx.moveTo(c.cx,c.cy);ctx.lineTo(needle[0],needle[1]);ctx.stroke();
  ctx.beginPath();ctx.moveTo(c.cx,c.cy);ctx.lineTo(pencil[0],pencil[1]);ctx.stroke();

  // needle foot
  ctx.strokeStyle="#333";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(needle[0],needle[1]);ctx.lineTo(needle[0]-4,needle[1]+15);ctx.stroke();

  // pencil body: its sharp contact point is exactly the arc endpoint used below.
  ctx.save();ctx.translate(pencil[0],pencil[1]);ctx.rotate(c.pencilAngle);
  ctx.strokeStyle="#c98900";ctx.fillStyle="#ffc347";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-34,-6);ctx.lineTo(-6,-6);ctx.lineTo(0,0);
  ctx.lineTo(-6,6);ctx.lineTo(-34,6);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();

  // hinge
  ctx.fillStyle="#151515";ctx.beginPath();ctx.arc(c.cx,c.cy,15,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ddd";ctx.beginPath();ctx.arc(c.cx,c.cy,4,0,Math.PI*2);ctx.fill();

  // handles
  ctx.fillStyle="#fff";ctx.strokeStyle="#5f61df";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(needle[0],needle[1],8,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(pencil[0],pencil[1],8,0,Math.PI*2);ctx.fill();ctx.stroke();

  ctx.restore();
  drawCompassRadiusDimension(needle,pencil);
}

function drawProtractor(){
  if(!protractor.visible)return;
  const p=protractor;
  ctx.save();
  ctx.translate(p.cx,p.cy);
  ctx.rotate(p.rotation);

  // translucent body
  ctx.fillStyle="rgba(240,236,210,.78)";
  ctx.strokeStyle="#5c5c5c";ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(0,0,p.radius,Math.PI,0,false);
  ctx.lineTo(p.radius,0);ctx.lineTo(-p.radius,0);ctx.closePath();
  ctx.fill();ctx.stroke();

  // inner semicircle
  ctx.beginPath();ctx.arc(0,0,p.radius*.72,Math.PI,0,false);ctx.stroke();

  // degree marks 0..180
  for(let deg=0;deg<=180;deg++){
    const a=Math.PI-deg*Math.PI/180;
    const major=deg%10===0;
    const medium=deg%5===0;
    const len=major?18:(medium?12:7);
    const r1=p.radius-len,r2=p.radius;
    ctx.lineWidth=major?1.6:0.7;
    ctx.beginPath();ctx.moveTo(r1*Math.cos(a),r1*Math.sin(a));
    ctx.lineTo(r2*Math.cos(a),r2*Math.sin(a));ctx.stroke();
    if(major && deg%20===0){
      ctx.save();ctx.translate((p.radius-32)*Math.cos(a),(p.radius-32)*Math.sin(a));
      ctx.rotate(-p.rotation);ctx.font="10px Arial";ctx.fillStyle="#333";
      ctx.fillText(String(deg),-7,3);ctx.restore()
    }
  }

  // centre mark + baseline
  ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-p.radius,0);ctx.lineTo(p.radius,0);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,5,0,Math.PI*2);ctx.fillStyle="#5f61df";ctx.fill();

  // rotation handle
  ctx.fillStyle="#fff";ctx.strokeStyle="#5f61df";
  ctx.beginPath();ctx.arc(0,-p.radius-24,9,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(0,-p.radius);ctx.lineTo(0,-p.radius-16);ctx.stroke();

  // optional ray
  if(p.rayAngle!==null){
    const local=p.rayAngle-p.rotation;
    ctx.strokeStyle="#1f5fbf";ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(p.radius*.95*Math.cos(local),p.radius*.95*Math.sin(local));ctx.stroke()
  }
  ctx.restore();

  if(p.rayAngle!==null){
    let rel=angleNorm(p.rayAngle-p.rotation);
    let deg=rel*180/Math.PI;
    if(deg>180)deg=360-deg;
    measureEl.textContent="Measured angle: "+deg.toFixed(1)+"°"
  }
}

function rulerPoint(localX,localY){
  const r=rulerInstrument,cos=Math.cos(r.rotation),sin=Math.sin(r.rotation);
  return [r.cx+localX*cos-localY*sin,r.cy+localX*sin+localY*cos]
}

function rulerLocal(x,y){
  const r=rulerInstrument,dx=x-r.cx,dy=y-r.cy,cos=Math.cos(r.rotation),sin=Math.sin(r.rotation);
  return [dx*cos+dy*sin,-dx*sin+dy*cos]
}

function rulerRotateHandle(){
  const r=rulerInstrument;
  return rulerPoint(0,-r.width/2-28)
}

function hitRuler(x,y){
  if(!rulerInstrument.visible)return null;
  const r=rulerInstrument,h=rulerRotateHandle();
  if(Math.hypot(x-h[0],y-h[1])<18)return"rotate";
  const [lx,ly]=rulerLocal(x,y);
  if(Math.abs(lx)<=r.length/2+6&&Math.abs(ly)<=r.width/2+6)return"move";
  return null
}

function rulerAngleDegrees(){
  let degrees=rulerInstrument.rotation*180/Math.PI;
  while(degrees<0)degrees+=180;while(degrees>=180)degrees-=180;
  return degrees
}

function drawRuler(){
  const r=rulerInstrument;if(!r.visible)return;
  ctx.save();ctx.translate(r.cx,r.cy);ctx.rotate(r.rotation);
  const left=-r.length/2,top=-r.width/2;
  ctx.fillStyle="rgba(255,222,115,.78)";ctx.strokeStyle="#8a6b19";ctx.lineWidth=2;
  ctx.beginPath();ctx.rect(left,top,r.length,r.width);ctx.fill();ctx.stroke();
  ctx.strokeStyle="#5c4814";ctx.fillStyle="#46380f";ctx.textAlign="center";ctx.textBaseline="top";
  for(let px=0;px<=r.length;px+=10){
    const halfUnit=px/10,major=halfUnit%2===0,medium=halfUnit%1===0;
    const tick=major?22:(medium?15:9),x=left+px;
    ctx.lineWidth=major?1.5:1;ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+tick);ctx.stroke();
    if(major){ctx.font="10px Arial";ctx.fillText(String(Math.round(px/20)),x,top+24)}
  }
  ctx.font="10px Arial";ctx.textAlign="right";ctx.fillText("units",left+r.length-5,top+r.width-15);
  ctx.restore();

  const h=rulerRotateHandle(),anchor=rulerPoint(0,-r.width/2);
  ctx.save();ctx.setLineDash([4,4]);ctx.strokeStyle="#7c651f";ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(anchor[0],anchor[1]);ctx.lineTo(h[0],h[1]);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="#fff";ctx.strokeStyle="#8a6b19";ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(h[0],h[1],10,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle="#725a18";ctx.font="bold 13px Arial";ctx.textAlign="left";ctx.fillText("↻",h[0]-6,h[1]+5);ctx.restore()
}

function redrawOverlay(){
  ctx.clearRect(0,0,cssW,cssH);
  ctx.drawImage(drawingCanvas,0,0,cssW,cssH);
  drawSegments();
  if(grid)drawGridOverlay();
  if(linePreview){
    ctx.save();ctx.strokeStyle="#222";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(linePreview.x1,linePreview.y1);ctx.lineTo(linePreview.x2,linePreview.y2);ctx.stroke();ctx.restore()
  }
  drawRuler();
  drawCompass();
  drawProtractor();
}

function setTool(t){
  if(t==="protractor"){
    if(protractor.visible){
      protractor.visible=false;protractor.dragging=null;
      if(tool==="protractor")tool="pen"
    }else{
      protractor.visible=true;tool="protractor"
    }
  }else if(t==="ruler"){
    if(rulerInstrument.visible){
      rulerInstrument.visible=false;rulerInstrument.dragging=null;
      if(tool==="ruler")tool="pen"
    }else{
      rulerInstrument.visible=true;tool="ruler"
    }
  }else{
    if(tool===t&&t==="compass")t="pen";
    tool=t
  }
  linePreview=null;
  if(tool!=="move")selectedSegment=-1;
  canvas.style.cursor=tool==="move"?"grab":"crosshair";
  document.querySelectorAll("[data-tool]").forEach(b=>{
    const active=b.dataset.tool==="protractor"?protractor.visible:
      (b.dataset.tool==="ruler"?rulerInstrument.visible:b.dataset.tool===tool);
    b.classList.toggle("active",active);b.setAttribute("aria-pressed",active?"true":"false");
    if(b.dataset.tool==="protractor")b.querySelector("span:last-child").textContent=protractor.visible?"Protractor ✓":"Protractor";
    if(b.dataset.tool==="ruler")b.querySelector("span:last-child").textContent=rulerInstrument.visible?"Ruler ✓":"Ruler"
  });
  compass.visible=tool==="compass";
  measureEl.textContent="";
  hintEl.style.display=(tool==="compass"||(tool==="protractor"&&protractor.visible)||(tool==="ruler"&&rulerInstrument.visible))?"block":"none";
  lengthControl.classList.toggle("visible",tool==="line");
  radiusControl.classList.toggle("visible",tool==="compass");
  if(tool==="compass"){
    statusEl.textContent="Compass — radius is measured from the needle (arc centre) to the pencil tip";
    hintEl.textContent="Compass: radius = needle → pencil tip • hinge = move • pencil tip = sweep arc"
  }else if(tool==="protractor"&&protractor.visible){
    statusEl.textContent="Protractor — drag its body to move; drag top handle to rotate; drag from centre to place/read a ray";
    hintEl.textContent="Protractor: body = move • top handle = rotate • centre = measure/draw ray"
  }else if(tool==="ruler"&&rulerInstrument.visible){
    statusEl.textContent="Ruler — drag its body to move; drag the ↻ handle to rotate; read length from the scale";
    hintEl.textContent="Ruler: numbered scale = measure • body = move • ↻ handle = rotate"
  }else{
    hintEl.style.display="none";
    statusEl.textContent={
      pen:"Pencil — Apple Pencil, touch or mouse",
      line:"Line — optionally type an exact length, then drag to choose direction",
      ruler:"Ruler — move and rotate the numbered measuring scale",
      move:"Move — drag a line to reposition it; drag its ↻ handle to rotate it",
      eraser:"Eraser — drag over unwanted working"
    }[tool]||tool
  }
  baseImage=drawingCanvas.toDataURL("image/png");
  redrawOverlay()
}

document.querySelectorAll("[data-tool]").forEach(btn=>btn.addEventListener("click",()=>setTool(btn.dataset.tool)));

function hitCompass(x,y){
  const c=compass;
  const needle=pointFrom(c.cx,c.cy,c.radius,c.needleAngle);
  const pencil=pointFrom(c.cx,c.cy,c.radius,c.pencilAngle);
  if(dist(x,y,c.cx,c.cy)<22)return"move";
  if(dist(x,y,needle[0],needle[1])<18)return"needle";
  if(dist(x,y,pencil[0],pencil[1])<22)return"pencil";
  return null
}

function hitProtractor(x,y){
  const p=protractor;
  const handle=pointFrom(p.cx,p.cy,p.radius+24,p.rotation-Math.PI/2);
  if(dist(x,y,handle[0],handle[1])<20)return"rotate";
  if(dist(x,y,p.cx,p.cy)<20)return"ray";
  if(dist(x,y,p.cx,p.cy)<p.radius+10)return"move";
  return null
}

function commitArc(prevAngle,newAngle){
  const c=compass;
  const needle=pointFrom(c.cx,c.cy,c.radius,c.needleAngle);
  // arc centre is needle point; radius equals distance needle->pencil
  const pencil=pointFrom(c.cx,c.cy,c.radius,c.pencilAngle);
  const rr=dist(needle[0],needle[1],pencil[0],pencil[1]);
  const delta=shortestDelta(newAngle,prevAngle);
  dctx.save();dctx.strokeStyle="#222";dctx.lineWidth=2;
  dctx.beginPath();dctx.arc(needle[0],needle[1],rr,prevAngle,prevAngle+delta,delta<0);dctx.stroke();dctx.restore()
}

function pointerStart(e){
  e.preventDefault();
  const [x,y]=pos(e);

  const rulerHit=hitRuler(x,y);
  if(rulerHit){
    const r=rulerInstrument;r.dragging=rulerHit;pointerDown=true;
    canvas.setPointerCapture?.(e.pointerId);
    if(rulerHit==="move"){
      r.dragOffsetX=x-r.cx;r.dragOffsetY=y-r.cy;canvas.style.cursor="grabbing";
      statusEl.textContent="Ruler — moving; read distances directly from the numbered scale"
    }else{
      r.dragAngleOffset=r.rotation-Math.atan2(y-r.cy,x-r.cx);canvas.style.cursor="alias";
      statusEl.textContent="Ruler — rotating around its midpoint"
    }
    redrawOverlay();return
  }

  if(tool==="move"){
    const rotateExisting=selectedSegment>=0&&hitRotationHandle(x,y,segments[selectedSegment]);
    const index=rotateExisting?selectedSegment:hitSegment(x,y);
    selectedSegment=index;
    if(index>=0){
      remember();pointerDown=true;moveStart={x,y};moveOriginal={...segments[index]};
      moveAction=rotateExisting?"rotate":"translate";
      if(moveAction==="rotate"){
        const h=rotationHandle(moveOriginal);
        moveStart.angle=Math.atan2(y-h.my,x-h.mx);
        moveStart.lineAngle=Math.atan2(moveOriginal.y2-moveOriginal.y1,moveOriginal.x2-moveOriginal.x1)
      }
      canvas.setPointerCapture?.(e.pointerId);
      canvas.style.cursor=moveAction==="rotate"?"alias":"grabbing";
      statusEl.textContent=moveAction==="rotate"
        ?"Move — rotate around the midpoint; line length is preserved"
        :"Move — reposition the selected line; its length and angle are preserved"
    }else{
      moveAction=null;
      statusEl.textContent="Move — tap a Line/Ruler line, then drag the line or its ↻ handle"
    }
    redrawOverlay();return
  }

  if(tool==="compass"){
    const h=hitCompass(x,y);
    if(h){
      remember();
      compass.dragging=h;
      if(h==="pencil"){
        const needle=pointFrom(compass.cx,compass.cy,compass.radius,compass.needleAngle);
        const pencil=pointFrom(compass.cx,compass.cy,compass.radius,compass.pencilAngle);
        compass.sweepStart=Math.atan2(pencil[1]-needle[1],pencil[0]-needle[0]);
        compass.sweepLast=compass.sweepStart
      }
      pointerDown=true;canvas.setPointerCapture?.(e.pointerId);return
    }
  }

  if(tool==="protractor"){
    const h=hitProtractor(x,y);
    if(h){
      remember();protractor.dragging=h;pointerDown=true;canvas.setPointerCapture?.(e.pointerId);
      if(h==="ray")protractor.rayAngle=Math.atan2(y-protractor.cy,x-protractor.cx);
      return
    }
  }

  remember();pointerDown=true;[sx,sy]=[x,y];baseImage=drawingCanvas.toDataURL("image/png");
  canvas.setPointerCapture?.(e.pointerId);
  if(tool==="pen"||tool==="eraser"){dctx.beginPath();dctx.moveTo(sx,sy)}
  if(tool==="eraser"&&eraseSegmentsAt(x,y))redrawOverlay()
}

function pointerMove(e){
  if(!pointerDown)return;
  e.preventDefault();
  const [x,y]=pos(e);

  if(rulerInstrument.dragging){
    const r=rulerInstrument;
    if(r.dragging==="move"){
      r.cx=Math.max(20,Math.min(cssW-20,x-r.dragOffsetX));
      r.cy=Math.max(20,Math.min(cssH-20,y-r.dragOffsetY))
    }else if(r.dragging==="rotate"){
      r.rotation=Math.atan2(y-r.cy,x-r.cx)+r.dragAngleOffset
    }
    measureEl.textContent="Ruler: "+(r.length/20).toFixed(1)+" units · angle: "+rulerAngleDegrees().toFixed(1)+"°";
    redrawOverlay();return
  }

  if(tool==="move"&&selectedSegment>=0&&moveStart&&moveOriginal){
    const s=segments[selectedSegment];
    if(moveAction==="rotate"){
      const h=rotationHandle(moveOriginal);
      const angle=moveStart.lineAngle+Math.atan2(y-h.my,x-h.mx)-moveStart.angle;
      const half=Math.hypot(moveOriginal.x2-moveOriginal.x1,moveOriginal.y2-moveOriginal.y1)/2;
      s.x1=h.mx-half*Math.cos(angle);s.y1=h.my-half*Math.sin(angle);
      s.x2=h.mx+half*Math.cos(angle);s.y2=h.my+half*Math.sin(angle)
    }else{
      const dx=x-moveStart.x,dy=y-moveStart.y;
      s.x1=moveOriginal.x1+dx;s.y1=moveOriginal.y1+dy;
      s.x2=moveOriginal.x2+dx;s.y2=moveOriginal.y2+dy
    }
    const units=Math.hypot(s.x2-s.x1,s.y2-s.y1)/20;
    let degrees=Math.atan2(s.y2-s.y1,s.x2-s.x1)*180/Math.PI;
    if(degrees<0)degrees+=180;if(degrees>=180)degrees-=180;
    measureEl.textContent="Length: "+units.toFixed(1)+" units · angle: "+degrees.toFixed(1)+"°";
    redrawOverlay();return
  }

  if(tool==="compass" && compass.dragging){
    const c=compass;
    if(c.dragging==="move"){
      c.cx=x;c.cy=y
    }else if(c.dragging==="needle"){
      c.radius=Math.max(45,Math.min(220,dist(c.cx,c.cy,x,y)));
      c.needleAngle=Math.atan2(y-c.cy,x-c.cx)
    }else if(c.dragging==="pencil"){
      const needle=pointFrom(c.cx,c.cy,c.radius,c.needleAngle);
      const ang=Math.atan2(y-needle[1],x-needle[0]);
      const delta=shortestDelta(ang,c.sweepLast);
      commitArc(c.sweepLast,ang);
      const oldPencil=pointFrom(c.cx,c.cy,c.radius,c.pencilAngle);
      const hx=c.cx-needle[0],hy=c.cy-needle[1];
      const px=oldPencil[0]-needle[0],py=oldPencil[1]-needle[1];
      const cos=Math.cos(delta),sin=Math.sin(delta);
      c.cx=needle[0]+hx*cos-hy*sin;c.cy=needle[1]+hx*sin+hy*cos;
      const newPencil=[needle[0]+px*cos-py*sin,needle[1]+px*sin+py*cos];
      c.needleAngle=Math.atan2(needle[1]-c.cy,needle[0]-c.cx);
      c.pencilAngle=Math.atan2(newPencil[1]-c.cy,newPencil[0]-c.cx);
      c.sweepLast=ang
    }
    compassRadiusInput.value=(compassRadiusPx()/20).toFixed(1);
    measureEl.textContent="Radius (needle → pencil tip): "+compassRadiusInput.value+" units";
    redrawOverlay();return
  }

  if(tool==="protractor" && protractor.dragging){
    const p=protractor;
    if(p.dragging==="move"){p.cx=x;p.cy=y}
    else if(p.dragging==="rotate"){p.rotation=Math.atan2(y-p.cy,x-p.cx)+Math.PI/2}
    else if(p.dragging==="ray"){p.rayAngle=Math.atan2(y-p.cy,x-p.cx)}
    redrawOverlay();return
  }

  if(tool==="pen"||tool==="eraser"){
    dctx.save();dctx.strokeStyle=tool==="eraser"?"#fffdf0":"#222";
    const pressure=(e.pressure&&e.pressure>0)?e.pressure:.5;
    dctx.lineWidth=tool==="eraser"?20:Math.max(1.5,1.3+pressure*2.3);
    dctx.lineTo(x,y);dctx.stroke();dctx.restore();
    if(tool==="eraser")eraseSegmentsAt(x,y);
    redrawOverlay();return
  }

  if(tool==="line"){
    let dx=x-sx,dy=y-sy;
    let px=Math.hypot(dx,dy);
    const exact=Number.parseFloat(lineLengthInput.value);
    if(Number.isFinite(exact)&&exact>0){
      const target=exact*20;
      if(px<1){dx=target;dy=0}else{dx=dx/px*target;dy=dy/px*target}
      px=target
    }
    linePreview={x1:sx,y1:sy,x2:sx+dx,y2:sy+dy};
    measureEl.textContent="Line length: "+(px/20).toFixed(1)+" units";
    redrawOverlay();return
  }
}

function pointerEnd(e){
  if(!pointerDown)return;
  pointerDown=false;
  try{canvas.releasePointerCapture?.(e.pointerId)}catch(_){}
  if(tool==="line"&&linePreview){
    const px=Math.hypot(linePreview.x2-linePreview.x1,linePreview.y2-linePreview.y1);
    segments.push({...linePreview,label:""});
    linePreview=null;redrawOverlay()
  }
  if(tool==="move"){
    const completedAction=moveAction;
    moveStart=null;moveOriginal=null;moveAction=null;canvas.style.cursor="grab";
    statusEl.textContent=selectedSegment>=0
      ?(completedAction==="rotate"?"Move — line rotated; use ↻ again or drag the line to reposition it":"Move — line repositioned; use ↻ to rotate it")
      :"Move — select a line"
  }
  if(tool==="compass")compass.dragging=null;
  if(tool==="protractor")protractor.dragging=null;
  if(rulerInstrument.dragging){
    rulerInstrument.dragging=null;canvas.style.cursor=tool==="move"?"grab":"crosshair";
    statusEl.textContent="Ruler positioned — scale length "+(rulerInstrument.length/20).toFixed(1)+" units · angle "+rulerAngleDegrees().toFixed(1)+"°"
  }
}

canvas.addEventListener("pointerdown",pointerStart,{passive:false});
canvas.addEventListener("pointermove",pointerMove,{passive:false});
canvas.addEventListener("pointerup",pointerEnd,{passive:false});
canvas.addEventListener("pointercancel",pointerEnd,{passive:false});

document.querySelector('[data-action="undo"]').addEventListener("click",()=>{if(history.length)restore(history.pop(),redrawOverlay)});
document.querySelector('[data-action="clear"]').addEventListener("click",()=>{
  remember();dctx.clearRect(0,0,cssW,cssH);segments=[];selectedSegment=-1;linePreview=null;redrawOverlay();measureEl.textContent=""
});
compassRadiusInput.addEventListener("change",()=>setCompassRadius(Number.parseFloat(compassRadiusInput.value)));
compassRadiusInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();setCompassRadius(Number.parseFloat(compassRadiusInput.value));canvas.focus()}});

document.getElementById("gridBtn").addEventListener("click",()=>{
  grid=!grid;document.getElementById("gridBtn").textContent=grid?"Grid ✓":"Grid";redrawOverlay()
});
document.getElementById("saveBtn").addEventListener("click",()=>{
  // Save only the student's drawing plus currently visible construction instruments.
  const previousSelection=selectedSegment;selectedSegment=-1;redrawOverlay();
  const value={kind:"geometry_board_png",data_url:canvas.toDataURL("image/png"),saved_at:Date.now()};
  selectedSegment=previousSelection;redrawOverlay();
  Streamlit.setComponentValue(value);statusEl.textContent="Saved to lesson notes"
});

window.addEventListener("message",(event)=>{
  const data=event.data;
  if(data&&data.type==="streamlit:render")Streamlit.setFrameHeight(730)
});

resizeCanvas(false);
Streamlit.setComponentReady();
Streamlit.setFrameHeight(730);
</script>
</body>
</html>
